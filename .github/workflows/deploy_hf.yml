# GitHub Actions Workflow for Hugging Face Spaces Deployment
name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Erase & Deploy Backend to Hugging Face Spaces
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 Erase HF Space & Deploy Backend
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "⚠️ HF_TOKEN secret is not set in GitHub Secrets. Skipping Hugging Face deployment."
            exit 0
          fi

          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          # 1. Create a clean isolated build folder for Hugging Face Space
          mkdir -p /tmp/hf_deploy
          
          # 2. Copy all backend code into the deployment folder
          cp -r backend/* /tmp/hf_deploy/
          
          # 3. Create Hugging Face Space README.md with YAML metadata
          cat << 'EOF' > /tmp/hf_deploy/README.md
---
title: CampusForge Backend API
emoji: 🎓
colorFrom: blue
colorTo: indigo
sdk: docker
app_port: 7860
pinned: false
---

# CampusForge Backend API (FastAPI)
Deployed automatically via GitHub Actions CI/CD.
EOF

          # 4. Initialize fresh Git repository in the deployment directory to completely overwrite HF Space
          cd /tmp/hf_deploy
          git init -b main
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Erase and redeploy CampusForge backend [Automated CI/CD]"

          # 5. Configure target Hugging Face Space remotes
          SPACE_NAME=${HF_SPACE_NAME:-demo}
          
          git remote add hf https://ashikulislam2024:${HF_TOKEN}@huggingface.co/spaces/ashikulislam2024/${SPACE_NAME} || \
          git remote add hf https://2024ashikul:${HF_TOKEN}@huggingface.co/spaces/2024ashikul/${SPACE_NAME} || true

          # 6. Force push to HF main branch to erase previous HF content and deploy backend
          git push -f hf main:main || echo "Hugging Face sync attempted. Verify HF_TOKEN secret permissions if needed."
